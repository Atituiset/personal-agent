# Mechanical checks that keep the repository legible to agents (see AGENTS.md):
# documentation links/freshness, the layer rules from ARCHITECTURE.md and the golden principles.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doc freshness compares code changes with last_reviewed dates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Doc check (links, AGENTS.md map, front matter, freshness)
        run: python scripts/doc_check.py
      - name: Architecture check (layer direction, third-party allowlist)
        run: python scripts/check_architecture.py
      - name: Golden principles scan (fail on drift not in scripts/golden_baseline.json)
        run: python scripts/golden_scan.py --fail-on-new
      - name: Self-tests for the checks
        run: python -m pytest -q tests/test_doc_check.py tests/test_architecture.py tests/test_golden_scan.py

  runtime:
    # Agent-legible runtime: start an isolated instance (worker + API + its own databases on the
    # postgres:17 service), check latency budgets and structured logs, run the 7 system checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: personal_agent
          POSTGRES_PASSWORD: personal_agent
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PA_DEV_ADMIN_URL: postgresql://personal_agent:personal_agent@127.0.0.1:5432/postgres
      PA_AGENTS_TRACING: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Runtime check (budgets + system checks) on a throwaway instance
        run: python scripts/runtime_check.py --up --name ci --db admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-check
          path: |
            var/dev/ci/runtime-check.*
            var/dev/ci/system-checks.json
            var/dev/ci/logs/
          if-no-files-found: ignore
