[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
version = "0.1.0"
description = "个人助理型 Agent：以 Postgres 异步任务队列为核心（M0）"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
  "openai-agents>=0.25,<0.26",   # agent.run / PA_LLM=agents；0.25.0 上测试过
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
personal-agent = "personal_agent.cli:main"

[tool.setuptools.packages.find]
include = ["personal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
